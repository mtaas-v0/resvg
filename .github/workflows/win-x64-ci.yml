name: Build and Upload resvg-cli (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout resvg source code
      uses: actions/checkout@v4
      with:
        repository: 'linebender/resvg' # Dynamically clones the official resvg repo

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc

    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        key: "resvg-windows"

    - name: Build thumbnailer
      working-directory: tools/explorer-thumbnailer
      env:
        RUSTFLAGS: -Ctarget-feature=+crt-static # make sure it's static
      run: cargo build
  
    # Unlike other binaries, viewsvg isn't built with crt-static
    - name: Build C API
      run: cargo build --release --bins
      
    - name: List files
      shell: bash
      run: ls . && find target

      
    - name: Prepare Artifact Workspace
      if: false
      shell: bash
      run: |
        # Create a clean folder to package the artifact
        mkdir -p dist/
        cp target/release/* dist/

    - name: Generate Datestamp
      id: date
      shell: bash
      run: |
        # Generates a stamp like YYYYMMDD
        echo "stamp=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        # Formats output as: resvg-windows-20260909-b42
        name: resvg-windows-${{ steps.date.outputs.stamp }}-b${{ github.run_number }}
        path: target
        if-no-files-found: error
        retention-days: 14
